# mise.toml — project-local tooling for building Brave Browser on macOS.
#
# Activate once:    mise trust && mise install
# Use tasks below:  mise run <task>
#
# Project-local env vars live in [env]. These are NOT exported to your shell —
# they're set automatically when you run `mise run <task>`. No ~/.zshrc,
# ~/.mise.toml, or user-level state touched.

[env]
# sccache config — keeps Brave's compile cache out of your user dir and
# outside the repo so it isn't accidentally committed. ~5-20 GB on disk.
SCCACHE_DIR = "/Users/sephyi/.cache/sccache-brave"
# Server-mode daemon (one sccache process, many concurrent compiles).
SCCACHE_EXTRA_ARGS = "--server"

[tools]
# Matches engines.node in package.json. mise will reuse the existing
# /opt/homebrew install if 24.x is already present.
node = "24"

# ---- Tasks — minimal "prepare → pull deps → build → run" flow ----------------
#
# First-time setup:
#   1. cd <project> && mise trust && mise install
#   2. mise run setup      # writes .env (gitignored) with GN args
#   3. mise run init       # downloads Chromium (~50 GB, one-time)
#   4. mise run build      # builds Brave (sccache-cached)
#   5. mise run start      # launches the app
#
# After edits to src/brave/:
#   mise run sync && mise run build

[tasks.setup]
description = "Write .env (gitignored) with M4 Pro build optimizations"
run = """
test -f .env && echo ".env already exists — leaving it untouched. Remove it manually if you want to regenerate." && exit 0 || cat > .env <<'EOF'
# Brave build configuration — generated by `mise run setup`.
# Format: KEY=value (parsed by build/commands/lib/envConfig.ts).
# Reference: https://github.com/brave/brave-browser/wiki/Build-configuration
#
# GN_ARGS_* keys are merged into args.gn by
# envConfig.getMergedObject(['gn', 'args']) in build/commands/lib/config.ts.

# ---- M4 Pro build optimization ---------------------------------------------
# Faster link, smaller binary, no debug symbols — best for incremental dev.
# Switch to is_debug=true / symbol_level=2 only when you need a debug session.
GN_ARGS_is_debug=false
GN_ARGS_symbol_level=0
GN_ARGS_strip_debug_info=true
GN_ARGS_enable_stripping=true

# Compiler cache — sccache must be installed (`brew install sccache`).
# Cache lives at $SCCACHE_DIR (set in [env] above).
GN_ARGS_cc_wrapper="sccache"

# Git cache for Chromium/deps sync. This is the difference between retries
# reusing downloaded objects and starting from scratch.
cache_dir=~/.cache/brave-core

# Optional Chromium mirror override for the primary src checkout.
# This does not affect depot_tools, and many DEPS still come from repos named
# in Chromium's DEPS file.
# projects_chrome_repository_url=https://github.com/chromium/chromium.git

# ---- Brave defaults you may want to override later --------------------------
# Uncomment + fill in to enable official-build-style keys:
# brave_google_api_key="..."
# brave_stats_api_key="..."
# is_official_build=false
EOF
echo ".env written. sccache is configured via cc_wrapper above."
"""

[tasks.init]
description = "Initialize Chromium checkout (one-time, downloads ~50GB)"
depends = ["setup"]
run = "npm run init && say 'Brave init complete'"

[tasks.sync]
description = "Update Chromium + brave-core + re-apply patches"
run = "npm run sync && say 'Brave sync complete'"

[tasks.build]
description = "Build Brave Component (sccache-cached via .env GN_ARGS)"
depends = ["setup"]
run = "npm run build && say 'Brave build complete'"

[tasks.build-release]
description = "Build Brave Release (slower, optimized binary)"
depends = ["setup"]
run = "npm run build Release && say 'Brave release build complete'"

[tasks.start]
description = "Launch built Brave (Component)"
run = "npm start"

[tasks.start-release]
description = "Launch Brave Release"
run = "npm start Release"

[tasks.test]
description = "Run brave_unit_tests"
run = "npm run test brave_unit_tests"

[tasks.clean]
description = "Remove build outputs (keeps src/, downloads, patches)"
run = "rm -rf out"

[tasks.sccache-stats]
description = "Show sccache hit/miss statistics for this build"
run = "sccache --show-stats"

[tasks.doctor]
description = "Verify Xcode, Node, sccache, mise are all present"
run = """
echo "=== Xcode ===" && xcode-select -p && xcodebuild -version | head -1 && \
echo "=== Node ===" && node --version && \
echo "=== npm ===" && npm --version && \
echo "=== sccache ===" && sccache --version && \
echo "=== mise ===" && mise --version
"""
